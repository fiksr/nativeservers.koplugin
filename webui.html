<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceee9">
<title>Kindle File Manager</title>
<style>
:root{
  --paper:#eceee9; --card:#fbfbf8; --ink:#16191c; --muted:#646d75; --line:#d7dad3; --soft:#e3e6df;
  --accent:#2c54d6; --accent-ink:#fff; --danger:#c8332e; --ok:#1c8a55; --warn:#b97a00;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(20,30,20,.25);
  --c-book:#3a62e6; --c-koreader:#0e9384; --c-system:#e0a100; --c-other:#8a63d2; --c-hidden:#9ba2aa;
  --c-doc:#5d6e82; --c-image:#d4437a; --c-media:#8a63d2; --c-archive:#d98a00; --c-font:#c4622b; --c-code:#3b9a4d; --c-sidecar:#8f969e; --c-file:#7d858d;
  --c-folder:#d99a1c;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --font:"Hind Siliguri","Noto Sans Bengali","Kohinoor Bangla","Bangla Sangam MN","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#101214; --card:#191c1f; --ink:#eceee9; --muted:#9aa3ab; --line:#2b3035; --soft:#22262a;
  --accent:#7d9cff; --accent-ink:#0b1020; --danger:#ff6b63; --ok:#4cc58a; --warn:#e6b341;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 10px 28px -14px rgba(0,0,0,.8);
  --c-book:#6f8dff; --c-koreader:#2ec4b0; --c-system:#f0b72a; --c-other:#a98af0; --c-hidden:#6d757d;
  --c-doc:#8ea0b5; --c-image:#f0709f; --c-media:#a98af0; --c-archive:#f0a92e; --c-font:#ee8650; --c-code:#62c274; --c-sidecar:#7b838b; --c-file:#98a0a8;
  --c-folder:#f0b43c;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:1.08rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batt{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink);padding:4px 9px 4px 7px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.batt i{position:relative;width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;display:block}
.batt i::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.batt i b{position:absolute;left:1px;top:1px;bottom:1px;background:currentColor;border-radius:1px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--soft)}
.chipbtn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* ---------- layout ---------- */
main{max-width:860px;margin:0 auto;padding:12px 14px 24px}
.view{display:none}.view.on{display:block}
.pagebar{display:flex;gap:8px;align-items:center;margin:2px 0 10px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:14px;color:var(--muted);font-size:.74rem;font-weight:600;position:relative}
.nav button.on{color:var(--ink);background:var(--soft)}
.nav button .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:92px}
  .nav{top:0;bottom:0;right:auto;width:92px;border-top:0;border-right:1px solid var(--line);grid-template-columns:1fr;align-content:start;padding-top:86px}
  .appbar{padding-left:20px}
}

/* ---------- storage strip (files view) ---------- */
.strip{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px}
.strip .row{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.strip .row b{color:var(--ink);font-weight:700}
.seg{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;background:var(--soft)}
.seg>i{display:block;height:100%;min-width:2px}
.seg.tall{height:20px;border-radius:10px;gap:3px}
.seg.tall>i{border-radius:5px}
.hatch{background-image:repeating-linear-gradient(135deg,var(--c-hidden) 0 3px,transparent 3px 6px)!important;background-color:transparent!important;box-shadow:inset 0 0 0 1px var(--c-hidden)}

/* ---------- breadcrumb / toolbar ---------- */
.crumbs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;align-items:center}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{flex:none;padding:5px 11px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:last-child{color:var(--ink);background:var(--card);border-color:var(--line)}
.crumbs .sep{color:var(--muted);opacity:.5;font-size:.9rem}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;min-width:0}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search svg{color:var(--muted)}
.tb{height:44px;width:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin:-2px 2px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint button{color:var(--accent);font-weight:700}

/* ---------- file list ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px 8px 9px 12px;border-bottom:1px solid var(--line);position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.item:last-child{border-bottom:0}
.item:active{background:var(--soft)}
.item.sel{background:color-mix(in srgb,var(--accent) 13%,var(--card))}
.item.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c-system) 35%,var(--card))}100%{background:var(--card)}}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;position:relative;color:var(--tone,var(--c-file));background:color-mix(in srgb,var(--tone,var(--c-file)) 14%,var(--card))}
.ico .ext{position:absolute;bottom:-3px;right:-3px;font:700 .56rem/1 var(--font);background:var(--tone,var(--c-file));color:var(--card);padding:2px 4px;border-radius:5px;letter-spacing:.02em}
.item .chk{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;z-index:2}
.selmode .item .chk{display:grid;opacity:0}
.selmode .item.sel .chk{opacity:1}
.selmode .item .ico{opacity:1}
.selmode .item:not(.sel) .ico::after{content:"";position:absolute;inset:0;border-radius:13px;border:2px solid var(--line);background:var(--card);opacity:.9}
.selmode .item.sel .ico{opacity:0}
.meta{min-width:0}
.meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span.path{font-family:var(--mono);font-size:.72rem}
.item .more{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.item .more:active{background:var(--soft)}
.list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:1px;background:var(--line)}
.list.grid .item{grid-template-columns:1fr;justify-items:center;text-align:center;padding:14px 8px 10px;gap:6px;border:0;background:var(--card)}
.list.grid .item.sel{background:color-mix(in srgb,var(--accent) 13%,var(--card))}
.list.grid .ico{width:56px;height:56px;border-radius:16px}
.list.grid .meta{width:100%}
.list.grid .meta b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.84rem;line-height:1.25;word-break:break-word}
.list.grid .more{display:none}
.list.grid .item .chk{left:8px;top:8px;transform:none;width:28px;height:28px}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:8px}
.morebtn{display:block;width:100%;padding:12px;color:var(--accent);font-weight:700;border-top:1px solid var(--line)}

/* ---------- FAB / selection bar ---------- */
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:35;width:58px;height:58px;border-radius:20px;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.55)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.fab:active{transform:scale(.96)}
@media(min-width:900px){.fab{bottom:28px}}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:var(--paper);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;transform:translateY(110%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.selbar.on{transform:none;visibility:visible;transition:transform .22s ease}
.selbar .cnt{flex:1;font-weight:700;padding-left:6px;white-space:nowrap}
.selbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.68rem;font-weight:600;padding:5px 10px;border-radius:12px;color:inherit}
.selbar button:active{background:rgba(128,128,128,.3)}
.selbar button.d{color:#ff8b84}
:root[data-theme="dark"] .selbar button.d{color:#c8332e}
@media(min-width:900px){.selbar{left:92px}}

/* ---------- sheets & dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:80;opacity:0;transition:opacity .18s;display:flex;align-items:flex-end;justify-content:center}
.scrim.on{opacity:1}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:8px 8px calc(14px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .22s ease;max-height:86vh;overflow:auto}
.scrim.on .sheet{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sheet h3{font-size:1rem;padding:6px 12px 2px;word-break:break-all}
.sheet .sub{padding:0 12px 8px;color:var(--muted);font-size:.82rem}
.sheet .act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border-radius:14px;font-weight:600}
.sheet .act:active{background:var(--soft)}
.sheet .act.danger{color:var(--danger)}
.sheet .act svg{color:var(--muted)}.sheet .act.danger svg{color:var(--danger)}
.sheet .sep{height:1px;background:var(--line);margin:4px 10px}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;padding-bottom:14px}}
.dlg{background:var(--card);width:calc(100% - 32px);max-width:420px;border-radius:24px;padding:20px 18px 14px;margin:auto;box-shadow:var(--shadow);transform:scale(.96);transition:transform .18s}
.scrim.on .dlg{transform:none}
.scrim.center{align-items:center}
.dlg h3{font-size:1.05rem;margin-bottom:6px}
.dlg p{color:var(--muted);margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.dlg input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--paper);outline:none;margin-bottom:12px}
.dlg input[type=text]:focus{border-color:var(--accent)}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:42px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:4px 12px 10px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{word-break:break-all;font-weight:600}

/* folder picker */
.picker{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:14px;margin:4px 8px 10px;background:var(--paper)}
.picker .item{grid-template-columns:40px 1fr;padding:6px 10px}
.picker .ico{width:36px;height:36px;border-radius:11px}
.pickbar{display:flex;gap:8px;padding:0 8px}

/* ---------- full-screen overlays (editor / preview) ---------- */
.full{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column}
.full header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.full header .t{flex:1;min-width:0}
.full header .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.full header .t small{color:var(--muted);font-size:.76rem}
.full header .dirty{color:var(--warn);font-weight:700}
#edtext{flex:1;width:100%;border:0;outline:none;resize:none;padding:14px;background:var(--paper);font-family:var(--mono);font-size:var(--edsize,14px);line-height:1.55;tab-size:4;white-space:pre;overflow:auto}
#edtext.wrap{white-space:pre-wrap;word-break:break-word}
.stage{flex:1;display:grid;place-items:center;overflow:auto;padding:12px;position:relative;background:color-mix(in srgb,var(--ink) 6%,var(--paper))}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.stage video,.stage audio{max-width:100%}
.stage iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
.stage .nav2{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.stage .nav2.l{left:10px}.stage .nav2.r{right:10px}

/* ---------- toast & upload panel ---------- */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-weight:600;z-index:120;opacity:0;transition:.2s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.upl{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px}
.upl .row{display:flex;justify-content:space-between;gap:10px;font-size:.84rem}
.upl .row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .15s}
.drop{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--accent) 22%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-size:1.3rem;font-weight:800;pointer-events:none;backdrop-filter:blur(2px)}

/* ---------- storage page ---------- */
.scanbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px;font-size:.84rem;color:var(--muted)}
.scanbar .grow{flex:1;min-width:0}
.scanbar b{color:var(--ink)}
.scanbar .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:.72rem}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 16px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .lab{color:var(--muted);font-weight:600;font-size:.86rem}
.big{font-size:2.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:1.15rem;font-weight:700;margin-left:4px;color:var(--muted);letter-spacing:0}
.hero .of{color:var(--muted);font-size:.86rem;margin:2px 0 14px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.legend div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.legend i{width:11px;height:11px;border-radius:4px;margin-top:5px;flex:none}
.legend span{display:block;font-size:.82rem;color:var(--muted);line-height:1.2}
.legend b{display:block;font-weight:700;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;font-weight:700;margin-bottom:2px}
.card .sub{color:var(--muted);font-size:.82rem;margin-bottom:12px}
.card .cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card .cardhead .tot{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin-bottom:10px}
.hb:last-child{margin-bottom:0}
.hb .n{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .v{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hb .t{grid-column:1/-1;height:9px;border-radius:5px;background:var(--soft);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:5px;background:var(--col,var(--accent));min-width:2px}
.hb.click{cursor:pointer}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:176px;height:176px;flex:none}
.donut svg{transform:rotate(-90deg);width:100%;height:100%}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-size:1.5rem;font-weight:800;line-height:1.1}
.donut .mid span{font-size:.76rem;color:var(--muted)}
.donutwrap .lg{flex:1;min-width:190px;display:flex;flex-direction:column;gap:7px}
.lg .r{display:flex;align-items:center;gap:8px;font-size:.86rem}
.lg .r i{width:11px;height:11px;border-radius:4px;flex:none}
.lg .r span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .r em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem}
.twocol{display:grid;gap:12px}
@media(min-width:760px){.twocol{grid-template-columns:1fr 1fr;align-items:start}}
.link{color:var(--accent);font-weight:700}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini .lab{font-size:.8rem;color:var(--muted)}
.mini b{font-size:1.05rem;display:block}

/* ---------- duplicates ---------- */
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px;gap:4px}
.seg2 button{padding:9px 6px;border-radius:11px;font-weight:700;font-size:.86rem;color:var(--muted)}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:12px;overflow:hidden}
.group header{padding:11px 14px 9px;border-bottom:1px solid var(--line)}
.group header b{display:block;font-weight:700;word-break:break-word}
.group header span{font-size:.8rem;color:var(--muted)}
.frow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.frow:last-of-type{border-bottom:0}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.frow.sel .cb{background:var(--danger);border-color:var(--danger);color:#fff}
.frow.sel{background:color-mix(in srgb,var(--danger) 8%,var(--card))}
.frow .p{font-family:var(--mono);font-size:.74rem;word-break:break-all;line-height:1.35}
.frow .p b{color:var(--ink);font-weight:700}
.frow .d{font-size:.76rem;color:var(--muted)}
.tag{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--muted);margin-left:6px;font-family:var(--font)}
.group footer{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.group footer button{font-size:.8rem;font-weight:700;color:var(--accent);padding:5px 10px;border-radius:9px;background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.dupbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;padding:0 14px;pointer-events:none}
.dupbar>div{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.dupbar b{flex:1;font-size:.9rem}
.dupbar .btn{height:40px;background:var(--danger);color:#fff}
@media(min-width:900px){.dupbar{bottom:16px;left:92px}}
.note{color:var(--muted);font-size:.8rem;margin:2px 4px 12px}
.good{display:grid;place-items:center;text-align:center;padding:40px 20px;color:var(--muted)}
.good svg{width:54px;height:54px;color:var(--ok);margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function sizeParts(b) {
  b = +b || 0; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (b >= 1024 && i < 4) { b /= 1024; i++; }
  const d = i === 0 ? 0 : (b >= 100 ? 0 : 1);
  return { n: nf(b, { maximumFractionDigits: d, minimumFractionDigits: 0 }), u: u[i] };
}
const fmtSize = b => { const p = sizeParts(b); return p.n + ' ' + p.u; };
const pct = (a, b) => b > 0 ? Math.round(a / b * 1000) / 10 : 0;
function fmtDate(sec) {
  if (!sec) return '—';
  const d = new Date(sec * 1000), now = new Date();
  const o = d.getFullYear() === now.getFullYear() ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' };
  return new Intl.DateTimeFormat(loc(), o).format(d);
}
function fmtAgo(sec) {
  const diff = Math.round(sec - Date.now() / 1000), rtf = new Intl.RelativeTimeFormat(loc(), { numeric: 'auto' });
  const a = Math.abs(diff);
  if (a < 60) return rtf.format(Math.round(diff), 'second');
  if (a < 3600) return rtf.format(Math.round(diff / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(diff / 3600), 'hour');
  return rtf.format(Math.round(diff / 86400), 'day');
}
const baseName = p => p.replace(/\/+$/, '').split('/').pop() || '/';
const parentOf = p => { const i = p.replace(/\/+$/, '').lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };
const joinRel = (d, n) => (d === '/' ? '' : d.replace(/\/+$/, '')) + '/' + n.replace(/^\/+/, '');
const extOf = n => { const m = /\.([^.\/]+)$/.exec(n); return m ? m[1].toLowerCase() : ''; };
const encPaths = list => list.map(encodeURIComponent).join('\n');

const ICON_OF = { book: 'book', doc: 'doc', image: 'image', media: 'media', archive: 'archive', font: 'font', code: 'code', sidecar: 'sidecar', other: 'file' };

let toastT;
function toast(msg, err) {
  const el = $('#toast'); el.textContent = msg; el.classList.toggle('err', !!err); el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), err ? 4200 : 2200);

/* ================= API ================= */
async function api(route, o = {}) {
  const qs = o.params ? new URLSearchParams(o.params).toString() : '';
  let res;
  try { res = await fetch(route + (qs ? '?' + qs : ''), { method: o.method || 'GET', body: o.body }); }
  catch (e) { toast(t('toast.net'), true); throw e; }
  if (o.text) { if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText); return res.text(); }
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || res.statusText || t('err.generic')); err.status = res.status; throw err; }
  return data;
}

/* ================= dialogs ================= */
function overlay(html, cls = '') {
  const sc = document.createElement('div'); sc.className = 'scrim ' + cls; sc.innerHTML = html;
  document.body.appendChild(sc); requestAnimationFrame(() => sc.classList.add('on'));
  const close = () => { sc.classList.remove('on'); setTimeout(() => sc.remove(), 200); };
  return { sc, close };
}
function ask(o) {
  return new Promise(resolve => {
    const btns = (o.extra || []).map(b => `<button class="btn ${b.cls || ''}" data-id="${b.id}">${esc(b.label)}</button>`).join('');
    const { sc, close } = overlay(`<div class="dlg" role="dialog">
      <h3>${esc(o.title || '')}</h3>${o.msg ? `<p>${esc(o.msg)}</p>` : ''}
      ${o.input ? `<input type="text" id="dlgIn" value="${esc(o.value || '')}" placeholder="${esc(o.ph || '')}" autocomplete="off" spellcheck="false" autocapitalize="off">` : ''}
      <div class="btns">${o.cancel === false ? '' : `<button class="btn" data-id="cancel">${esc(t('act.cancel'))}</button>`}${btns}
      <button class="btn ${o.okCls || 'pri'}" data-id="ok">${esc(o.ok || t('act.ok'))}</button></div></div>`, 'center');
    const inp = $('#dlgIn', sc);
    const done = v => { close(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } else if (e.key === 'Enter' && inp) { e.preventDefault(); submit(); } };
    const submit = () => { if (inp) { const v = inp.value.trim(); if (v) done(v); } else done('ok'); };
    sc.addEventListener('click', e => {
      const b = e.target.closest('[data-id]');
      if (b) { b.dataset.id === 'ok' ? submit() : done(b.dataset.id === 'cancel' ? null : b.dataset.id); }
      else if (e.target === sc) done(null);
    });
    document.addEventListener('keydown', onKey, true);
    if (inp) { inp.focus(); const dot = (o.value || '').lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 && o.selectStem ? dot : (o.value || '').length); }
  });
}
function sheet(o) {
  return new Promise(resolve => {
    const acts = o.actions.map(a => a.sep ? '<div class="sep"></div>' :
      `<button class="act ${a.danger ? 'danger' : ''}" data-id="${a.id}">${ic(a.icon)}<span>${esc(a.label)}</span></button>`).join('');
    const { sc, close } = overlay(`<div class="sheet"><div class="grab"></div>${o.title ? `<h3>${esc(o.title)}</h3>` : ''}${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}${acts}</div>`);
    const done = v => { close(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    sc.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) done(b.dataset.id); else if (e.target === sc) done(null); });
    document.addEventListener('keydown', onKey, true);
  });
}

/* ================= navigation ================= */
function pathFromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.startsWith('/storage')) return { tab: 'storage' };
  if (h.startsWith('/dups')) return { tab: 'dups' };
  const m = /^\/files(\/.*)?$/.exec(h);
  return { tab: 'files', path: m && m[1] ? m[1] : '/' };
}
function hashFor(tab, path) {
  if (tab === 'files') return '#/files' + (path && path !== '/' ? path.split('/').map(encodeURIComponent).join('/') : '');
  return '#/' + tab;
}
function go(path, opts = {}) {
  S.flash = opts.flash || null;
  const h = hashFor('files', path);
  if (location.hash === h) route(); else location.hash = h;
}
async function route() {
  const r = pathFromHash();
  switchTab(r.tab);
  if (r.tab === 'files') { await loadDir(r.path); }
  else { ensureScan(false); }
}
function switchTab(tab) {
  S.tab = tab;
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#fab').hidden = tab !== 'files' || S.selMode;
  $('#dupbar').hidden = !(tab === 'dups' && S.dupSel.size);
  if (tab !== 'files' && S.selMode) setSelMode(false);
  window.scrollTo(0, 0);
}

/* ================= directory loading / rendering ================= */
async function loadDir(path, keepSel) {
  try {
    const d = await api('/api/list', { params: { path } });
    S.path = d.path; S.items = d.items.map(i => ({ ...i, p: joinRel(d.path, i.n) }));
    S.searchRes = null; S.q = ''; $('#q').value = ''; S.shown = 300;
    if (!keepSel) { S.sel.clear(); setSelMode(false); }
    renderCrumbs(); renderList(); $('#hint').hidden = true;
    if (S.flash) {
      const idx = visibleItems().findIndex(i => i.n === S.flash);
      if (idx >= 0) { S.shown = Math.max(S.shown, idx + 1); renderList(); const el = $(`.item[data-i="${idx}"]`); if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center' }); } }
      S.flash = null;
    }
  } catch (e) {
    if (e.status === 404 && path !== '/') go('/'); else if (e.status) toast(e.message, true);
  }
}
function renderCrumbs() {
  const parts = S.path === '/' ? [] : S.path.split('/').filter(Boolean);
  let h = `<button data-go="/">${ic('files', 'sm')}</button>`, acc = '';
  parts.forEach((p, i) => { acc += '/' + p; h += `<span class="sep">›</span><button data-go="${esc(acc)}">${esc(p)}</button>`; });
  const el = $('#crumbs'); el.innerHTML = h; el.scrollLeft = el.scrollWidth;
}
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function sorted(items) {
  const k = S.sortKey, dir = S.sortDir === 'asc' ? 1 : -1;
  return [...items].sort((a, b) => {
    if (a.d !== b.d) return b.d - a.d;
    let c = 0;
    if (k === 'size') c = a.s - b.s; else if (k === 'date') c = a.m - b.m;
    else if (k === 'type') c = collator.compare(extOf(a.n), extOf(b.n));
    if (c === 0) c = collator.compare(a.n, b.n); else c *= 1;
    return k === 'name' || c === 0 ? c * dir : c * dir;
  });
}
function visibleItems() {
  if (S.searchRes) return S.searchRes;
  const q = S.q.trim().toLowerCase();
  const base = q ? S.items.filter(i => i.n.toLowerCase().includes(q)) : S.items;
  return sorted(base);
}
function rowHtml(it, i) {
  const k = kindOf(it), sel = S.sel.has(it.p);
  const sub = it.d ? t('folder') + ' · ' + fmtDate(it.m) : fmtSize(it.s) + ' · ' + fmtDate(it.m);

    <div class="chk">${ic('check')}</div>
    <div class="ico" style="--tone:var(--c-${k.cat})">${ic(k.icon)}${k.ext ? `<span class="ext">${esc(k.ext)}</span>` : ''}</div>
    <div class="meta"><b>${esc(it.n)}</b><span>${sub}</span>${S.searchRes ? `<span class="path">${esc(parentOf(it.p))}</span>` : ''}</div>
    <button class="more" data-more="${i}" aria-label="More">${ic('more')}</button></div>`;
}
function renderList() {

/* ================= open / actions ================= */
async function openItem(it) {
  if (it.d) { go(it.p); return; }
  if (isImage(it.n) || /^(mp3|m4a|ogg|wav|mp4|webm|pdf)$/.test(extOf(it.n))) return openPreview(it);
  if (isText(it.n)) return openEditor(it);
  return itemSheet(it);
}
async function itemSheet(it) {
  const acts = [];
  if (!it.d && (isImage(it.n) || /^(mp3|m4a|ogg|wav|mp4|webm|pdf)$/.test(extOf(it.n)))) acts.push({ id: 'open', icon: 'open', label: t('act.open') });
  if (!it.d && isText(it.n)) acts.push({ id: 'edit', icon: 'edit', label: t('act.edit') });
  if (it.d) acts.push({ id: 'open', icon: 'open', label: t('act.open') });
  if (!it.d) acts.push({ id: 'dl', icon: 'down', label: t('act.download') });
  if (S.searchRes) acts.push({ id: 'where', icon: 'folder', label: t('act.openfolder') });
  acts.push({ sep: 1 },
    { id: 'rename', icon: 'edit', label: t('act.rename') }, { id: 'copy', icon: 'copy', label: t('act.copy') },
    { id: 'move', icon: 'move', label: t('act.move') }, { id: 'info', icon: 'info', label: t('act.info') },
    { sep: 1 }, { id: 'select', icon: 'select', label: t('act.select') }, { id: 'del', icon: 'trash', label: t('act.delete'), danger: 1 });
  const a = await sheet({ title: it.n, sub: it.d ? t('folder') : fmtSize(it.s), actions: acts });
  if (a === 'open') it.d ? go(it.p) : openPreview(it);
  else if (a === 'edit') openEditor(it);
  else if (a === 'dl') { const l = document.createElement('a'); l.href = fileUrl(it.p); l.download = it.n; document.body.appendChild(l); l.click(); l.remove(); }
  else if (a === 'where') go(parentOf(it.p), { flash: it.n });
  else if (a === 'rename') doRename(it);
  else if (a === 'copy') doTransfer('copy', [it]);
  else if (a === 'move') doTransfer('move', [it]);
  else if (a === 'info') showInfo(it);
  else if (a === 'select') { setSelMode(true); S.sel.add(it.p); updateSelCount(); renderList(); }
  else if (a === 'del') doDelete([it]);
}
async function afterMutation() { S.stale = true; await loadDir(S.path, false); loadInfo(); }

async function doRename(it) {
  const name = await ask({ title: t('rename.title'), input: true, value: it.n, selectStem: !it.d, ok: t('act.save') });
  if (!name || name === it.n) return;
  try { await api('/api/rename', { method: 'POST', params: { path: it.p, name } }); toast(t('toast.renamed')); afterMutation(); }
  catch (e) { if (e.status) toast(e.message, true); }
}
async function doDelete(items) {
  const inKo = items.some(i => S.info && S.info.ko && (i.p + '/').startsWith(S.info.ko.slice((S.info.root || '').length) + '/'));
  const msg = [items.length === 1 ? '' : '', items.some(i => i.d) ? t('del.dir') : '', t('del.note'), inKo ? '\n' + t('del.ko') : ''].filter(Boolean).join('\n');
  const ok = await ask({ title: items.length === 1 ? t('del.one', { name: items[0].n }) : t('del.many', { n: nf(items.length) }), msg, ok: t('act.delete'), okCls: 'danger' });
  if (!ok) return;
  try {
    const r = await api('/api/delete', { method: 'POST', body: encPaths(items.map(i => i.p)) });
    if (r.failed_count) toast(t('toast.fail', { n: nf(r.failed_count), err: r.failed[0].e }), true); else toast(t('toast.deleted', { n: nf(r.ok) }));
    setSelMode(false); afterMutation();
  } catch (e) { if (e.status) toast(e.message, true); }
}
async function doTransfer(kind, items) {

  try {
    const r = await api('/api/' + kind, { method: 'POST', params: { dest }, body: encPaths(items.map(i => i.p)) });
    if (r.failed_count) toast(t('toast.fail', { n: nf(r.failed_count), err: r.failed[0].e }), true); else toast(t(kind === 'move' ? 'toast.moved' : 'toast.copied', { n: nf(r.ok) }));
    setSelMode(false); afterMutation();
  } catch (e) { if (e.status) toast(e.message, true); }
}
async function pickFolder(kind, items) {
  return new Promise(resolve => {
    let cur = S.path;
    const exclude = new Set(items.filter(i => i.d).map(i => i.p));
    const { sc, close } = overlay(`<div class="sheet"><div class="grab"></div><h3>${esc(t('pick.' + kind))}</h3>
      <div class="crumbs" id="pkCr" style="padding:0 8px 6px"></div><div class="picker" id="pkList"></div>
      <div class="pickbar"><button class="btn" data-id="cancel" style="flex:1">${esc(t('act.cancel'))}</button><button class="btn pri" data-id="ok" style="flex:2">${esc(t('act.here.' + kind))}</button></div></div>`);
    const done = v => { close(); resolve(v); };
    async function load(p) {
      try {
        const d = await api('/api/list', { params: { path: p } }); cur = d.path;
        const dirs = d.items.filter(i => i.d && !exclude.has(joinRel(cur, i.n))).sort((a, b) => collator.compare(a.n, b.n));
        let cr = `<button data-pg="/">${ic('files', 'sm')}</button>`, acc = '';
        cur.split('/').filter(Boolean).forEach(s => { acc += '/' + s; cr += `<span class="sep">›</span><button data-pg="${esc(acc)}">${esc(s)}</button>`; });
        $('#pkCr', sc).innerHTML = cr; $('#pkCr', sc).scrollLeft = 9999;
        $('#pkList', sc).innerHTML = (cur !== '/' ? `<div class="item" data-pg="${esc(parentOf(cur))}"><div class="ico" style="--tone:var(--c-hidden)">${ic('back')}</div><div class="meta"><b>${esc(t('act.upfolder'))}</b></div></div>` : '') +
          dirs.map(i => `<div class="item" data-pg="${esc(joinRel(cur, i.n))}"><div class="ico" style="--tone:var(--c-folder)">${ic('folder')}</div><div class="meta"><b>${esc(i.n)}</b></div></div>`).join('') +
          (!dirs.length ? `<div class="empty" style="padding:22px">${esc(t('pick.empty'))}</div>` : '');
      } catch (e) { done(null); }
    }
    sc.addEventListener('click', e => {
      const g = e.target.closest('[data-pg]'); if (g) { load(g.dataset.pg); return; }
      const b = e.target.closest('[data-id]'); if (b) done(b.dataset.id === 'ok' ? cur : null); else if (e.target === sc) done(null);

}

/* ================= upload ================= */
let upl = null;
async function uploadFiles(files, base) {
  files = [...files]; if (!files.length) return;
  const existing = new Set(S.items.map(i => i.p));
  let list = files.map(f => ({ f, p: joinRel(base, f.webkitRelativePath || f.name) }));
  const total0 = list.reduce((a, x) => a + x.f.size, 0), free = S.info && S.info.disk ? S.info.disk.free : null;
  if (free != null && total0 > free) { await ask({ title: t('upl.nospace'), msg: t('upl.nospace.msg', { need: fmtSize(total0), free: fmtSize(free) }), cancel: false }); return; }
  const conflicts = list.filter(x => !x.f.webkitRelativePath && existing.has(x.p));
  if (conflicts.length) {
    const c = await ask({ title: t('upl.exists'), msg: t('upl.exists.msg', { n: nf(conflicts.length) }), ok: t('act.replace'), extra: [{ id: 'skip', label: t('act.skip') }] });
    if (c === null) return; if (c === 'skip') list = list.filter(x => !conflicts.includes(x));
  }
  if (!list.length) return;
  const total = list.reduce((a, x) => a + x.f.size, 0); let doneBytes = 0, failed = null;
  const el = document.createElement('div'); el.className = 'upl';
  el.innerHTML = `<div class="row"><b id="uName"></b><span id="uPct" class="num"></span></div><div class="bar"><i id="uBar" style="width:0"></i></div><div class="row"><span id="uInfo"></span><button class="link" id="uCancel">${esc(t('upl.cancel'))}</button></div>`;
  document.body.appendChild(el); upl = { abort: false, xhr: null };
  $('#uCancel', el).onclick = () => { upl.abort = true; if (upl.xhr) upl.xhr.abort(); };
  const t0 = Date.now();
  for (let i = 0; i < list.length && !upl.abort; i++) {
    const { f, p } = list[i];
    $('#uName', el).textContent = f.name;
    try {
      await new Promise((res, rej) => {
        const x = new XMLHttpRequest(); upl.xhr = x;
        x.open('POST', '/api/upload?path=' + encodeURIComponent(p));
        x.upload.onprogress = e => {
          const cur = doneBytes + e.loaded, pc = total ? Math.min(100, cur / total * 100) : 100, sp = cur / Math.max(1, (Date.now() - t0) / 1000);
          $('#uBar', el).style.width = pc + '%'; $('#uPct', el).textContent = nf(Math.round(pc)) + '%';
          $('#uInfo', el).textContent = t('upl.progress', { i: nf(i + 1), n: nf(list.length) }) + ' · ' + fmtSize(sp) + '/s';
        };
        x.onload = () => { if (x.status >= 200 && x.status < 300) res(); else { let m = x.statusText; try { m = JSON.parse(x.responseText).error; } catch (e) {} rej(new Error(m)); } };
        x.onerror = () => rej(new Error(t('toast.net'))); x.onabort = () => rej(new Error('aborted'));
        x.send(f);
      });
      doneBytes += f.size;
    } catch (e) { if (!upl.abort) failed = e.message; break; }
  }
  el.remove(); const aborted = upl.abort; upl = null;
  $('#fileIn').value = ''; $('#dirIn').value = '';
  if (failed) toast(t('upl.fail', { err: failed }), true); else if (!aborted) toast(t('upl.done'));
  afterMutation();
}

let ed = null;
async function openEditor(it) {
  let text;
  try { text = await api('/api/read', { params: { path: it.p }, text: true }); }
  catch (e) { if (e.message) toast(e.message, true); return; }
  const fs = +LS.get('ks.edfs', 14);
  const o = document.createElement('div'); o.className = 'full'; o.style.setProperty('--edsize', fs + 'px');
  o.innerHTML = `<header><button class="iconbtn" id="edX" aria-label="Close">${ic('x')}</button>
    <div class="t"><b>${esc(it.n)} <span class="dirty" id="edDirty" hidden>●</span></b><small id="edInfo"></small></div>
    <button class="iconbtn" id="edWrap" title="${esc(t('ed.wrap'))}">${ic('wrap')}</button>
    <button class="iconbtn" id="edMinus">${ic('minus')}</button><button class="iconbtn" id="edPlus">${ic('plus')}</button>
    <button class="btn pri" id="edSave">${esc(t('act.save'))}</button></header>
    <textarea id="edtext" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>`;
  document.body.appendChild(o);
  const ta = $('#edtext', o); ta.value = text; ed = { it, orig: text, o };
  const upd = () => { const dirty = ta.value !== ed.orig; $('#edDirty', o).hidden = !dirty; $('#edInfo', o).textContent = it.p + ' · ' + t('ed.lines', { n: nf(ta.value.split('\n').length) }); };
  upd(); ta.addEventListener('input', upd);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); upd(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  const save = async () => {
    const b = $('#edSave', o); b.disabled = true;
    try { await api('/api/save', { method: 'POST', params: { path: it.p }, body: ta.value }); ed.orig = ta.value; upd(); toast(t('toast.saved')); S.stale = true; }
    catch (e) { if (e.message) toast(e.message, true); } finally { b.disabled = false; }
  };
  const closeEd = async () => {
    if (ta.value !== ed.orig) { const r = await ask({ title: t('ed.unsaved'), msg: t('ed.discard'), ok: t('ed.keep'), extra: [{ id: 'discard', label: t('ed.discardbtn'), cls: 'danger' }], cancel: false }); if (r !== 'discard') return; }
    o.remove(); ed = null; loadDir(S.path, true);
  };
  $('#edSave', o).onclick = save; $('#edX', o).onclick = closeEd;
  $('#edWrap', o).onclick = () => ta.classList.toggle('wrap');
  const fsz = d => { const v = Math.max(10, Math.min(28, (+getComputedStyle(o).getPropertyValue('--edsize').replace('px', '') || 14) + d)); o.style.setProperty('--edsize', v + 'px'); LS.set('ks.edfs', v); };
  $('#edPlus', o).onclick = () => fsz(1); $('#edMinus', o).onclick = () => fsz(-1);
  ed.close = closeEd; ta.focus({ preventScroll: true });
}

/* ================= preview ================= */
let pv = null;
function openPreview(it) {
  const imgs = visibleItems().filter(i => !i.d && isImage(i.n)); let idx = imgs.findIndex(i => i.p === it.p);
  const o = document.createElement('div'); o.className = 'full'; pv = { o };
  const show = () => {
    const cur = isImage(it.n) && idx >= 0 ? imgs[idx] : it, e = extOf(cur.n), u = fileUrl(cur.p, true);
    let body;
    if (isImage(cur.n)) body = `<img src="${u}" alt="">`;
    else if (/^(mp3|m4a|ogg|wav)$/.test(e)) body = `<audio controls autoplay src="${u}"></audio>`;
    else if (/^(mp4|webm)$/.test(e)) body = `<video controls autoplay playsinline src="${u}"></video>`;
    else if (e === 'pdf') body = `<iframe src="${u}"></iframe>`;
    else body = `<div class="empty">${ic('file')}<div>${esc(t('pv.none'))}</div></div>`;
    const nav = isImage(cur.n) && imgs.length > 1 ? `<button class="nav2 l" data-pv="-1">${ic('back')}</button><button class="nav2 r" data-pv="1">${ic('chev')}</button>` : '';
    o.innerHTML = `<header><button class="iconbtn" data-pv="x">${ic('x')}</button><div class="t"><b>${esc(cur.n)}</b><small>${fmtSize(cur.s)} · ${fmtDate(cur.m)}</small></div>
      <a class="iconbtn" href="${fileUrl(cur.p, true)}" target="_blank" rel="noopener" title="${esc(t('pv.open'))}">${ic('open')}</a>
      <a class="iconbtn" href="${fileUrl(cur.p)}" download="${esc(cur.n)}" title="${esc(t('act.download'))}">${ic('down')}</a></header><div class="stage">${body}${nav}</div>`;
  };
  o.addEventListener('click', e => {
    const b = e.target.closest('[data-pv]'); if (!b) return;
    if (b.dataset.pv === 'x') { o.remove(); pv = null; }
    else { idx = (idx + +b.dataset.pv + imgs.length) % imgs.length; show(); }
  });
  show(); document.body.appendChild(o);
}

/* ================= scan control ================= */
async function ensureScan(force) {
  try {
    const st = await api('/api/scan/status');
    if (force || st.state === 'idle' || st.state === 'stopped') {
      S.stale = false; await api('/api/scan/start', { method: 'POST' });
      S.resDone = false;
    }
  } catch (e) { return; }
  pollScan();
}
async function pollScan() {
  clearTimeout(S.pollT);
  let st;
  try { st = await api('/api/scan/status'); } catch (e) { return; }
  S.scan = st;
  const running = st.state === 'walking' || st.state === 'hashing';
  if (st.has_result && (S.resAt !== st.at || (st.state === 'done' && !S.resDone))) {
    try {
      const r = await api('/api/scan/result');
      if (r.at) { S.res = r; S.resAt = r.at; S.resDone = r.state === 'done'; if (S.resDone) S.stale = false; renderStrip(); renderStorage(); renderDups(); updateDupBadge(); }
    } catch (e) {}
  } else { updateScanBar(); if (S.tab === 'dups' && !(S.res && S.res.dups)) renderDups(); }

async function deleteDupSel() {

  for (const g of all) if (g.files.every(f => S.dupSel.has(f.p))) { toast(t('dups.keepone'), true); return; }
  const { n, sz } = dupSelInfo();
  const ok = await ask({ title: t('dups.confirm', { n: nf(n), size: fmtSize(sz) }), msg: t('del.note'), ok: t('act.delete'), okCls: 'danger' });
  if (!ok) return;

    const paths = [...S.dupSel], r = await api('/api/delete', { method: 'POST', body: encPaths(paths) });
    const failed = new Set((r.failed || []).map(f => f.p)), gone = new Set(paths.filter(p => !failed.has(p)));

  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (ed) ed.close(); else if (pv) { pv.o.remove(); pv = null; } else if (S.selMode) setSelMode(false); }
  });
  window.addEventListener('beforeunload', e => { if (ed && $('#edtext').value !== ed.orig) { e.preventDefault(); e.returnValue = ''; } });

  applyLang(); loadInfo(); route();
});

})();
</script>
